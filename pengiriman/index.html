*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{background:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--g-orbs),var(--bg)}
button,input,select{font:inherit;color:inherit}
input,select{background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;color:var(--text)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
select option{background:var(--g-solid)}
a{color:var(--acc)}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}
.err{color:var(--red);font-weight:600;min-height:1.2em;margin:0;font-size:14px}
.card{background:var(--card);border:1px solid var(--g-edge);border-radius:18px;box-shadow:inset 0 1px 0 var(--g-hi),var(--shadow);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur)}
.btn{border:1px solid var(--g-edge);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;text-decoration:none;color:var(--text);box-shadow:inset 0 1px 0 var(--g-hi);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.go{background:linear-gradient(135deg,#1f6fc0,#1857a0);border-color:#1857a0;font-weight:800;letter-spacing:.02em}
.btn.danger{color:var(--red)}
.btn.danger-f{background:var(--red);border-color:var(--red);color:#fff}
.btn.on{border-color:var(--acc);color:var(--acc)}
.ib{border:0;background:transparent;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:8px;line-height:1}
.ib:hover{background:var(--soft)}

.ahg-logo.hdr{width:46px;height:36px}

/* shell */
.cshell{min-height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.ctop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border-bottom:1px solid var(--g-edge);margin:0 -16px;padding-left:16px;padding-right:16px}
.ct{display:flex;flex-direction:column;line-height:1.2}.ct b{font-size:17px;color:var(--acc)}.ct span{font-size:12px;color:var(--muted)}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:13px}.who small{color:var(--muted)}
.ctabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:14px 0;border-radius:16px;background:var(--card);border:1px solid var(--g-edge);box-shadow:inset 0 1px 0 var(--g-hi),var(--shadow);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur)}
.ctab{border:0;background:transparent;border-radius:12px;padding:12px 8px;font-weight:800;letter-spacing:.03em;cursor:pointer;color:var(--muted);font-size:15px}
.ctab.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
main{flex:1}
.cfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:18px 2px 4px}
.sync.ok{color:var(--green)}.sync.bad{color:var(--red)}

/* input kirim */
.fcard{padding:20px;display:flex;flex-direction:column;gap:14px}
.fh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.clk{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.clk span{font-size:11.5px;color:var(--muted)}.clk b{font-variant-numeric:tabular-nums;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;min-width:0}
.fld.sm{font-size:12.5px;gap:4px}
.fld input{width:100%;padding:11px 36px 11px 12px;font-size:16px}
.fld.sm input{padding:8px 32px 8px 10px;font-size:14px}
.fld input.auto{animation:auto 1.6s}
@keyframes auto{0%,60%{background:color-mix(in srgb,#22c55e 25%,transparent)}}
.cb{position:relative;min-width:0;flex:1}
.cb-t{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px 10px;font-size:14px}
.cb.act input{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.cb-pop{position:fixed;z-index:1000;overflow:auto;background:var(--g-solid);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,20,40,.22);padding:4px;backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur)}
.cb-o{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.cb-o.hi{background:var(--acc);color:#fff}
.cb-o.hi mark{background:rgba(255,255,255,.3);color:inherit}
.cb-o mark{background:color-mix(in srgb,#fbbf24 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.cb-o.add{color:var(--acc);border-top:1px dashed var(--line);margin-top:2px}
.cb-o.add.hi{color:#fff}
.cb-none{padding:10px 12px;color:var(--muted);font-size:14px}
.fact{display:flex;gap:10px;align-items:center}
.fact .go{font-size:17px;padding:14px 22px;border-radius:14px}
.lcard2{margin-top:14px;padding:14px 16px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.lrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 12px;align-items:baseline;padding:8px 6px;border-top:1px solid var(--line)}
.lrow.new{background:color-mix(in srgb,#22c55e 12%,transparent);border-radius:10px}
.lt{font-variant-numeric:tabular-nums}.ld{color:var(--muted);font-size:13px}.lk{color:var(--muted);font-size:13px;white-space:nowrap}
.lx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* history */
.hbar{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hq{flex:1;min-width:180px}
.hrange{display:inline-flex;align-items:center;gap:6px}
.fgrid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fgrid2[hidden]{display:none}
.fx{display:flex;align-items:center;gap:2px}
.freset{display:flex;align-items:flex-end}
.sum{display:grid;grid-template-columns:150px 190px minmax(0,1fr);gap:10px;margin:12px 0}
.kpi{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.kpi>span{font-size:12px;color:var(--muted);font-weight:600}
.kpi>b{font-size:24px;font-variant-numeric:tabular-nums}.kpi small{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.hday{margin:14px 0}
.hd{display:flex;justify-content:space-between;gap:10px;padding:0 4px 6px;font-size:14px}.hd span{color:var(--muted)}
.tbl{overflow:hidden}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.new td{background:color-mix(in srgb,#22c55e 12%,transparent)}
.r{text-align:right!important}
.tm{font-weight:800;font-variant-numeric:tabular-nums}.kb{font-weight:800;font-variant-numeric:tabular-nums}
.tmno{color:var(--acc)}
.mt{display:inline-block;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--ahg-red) 12%,transparent);color:color-mix(in srgb,var(--ahg-red) 85%,var(--text));font-weight:700;font-size:12.5px;white-space:nowrap}
.ow{color:var(--muted);font-size:13px}.ow small{display:block;color:var(--warn)}

  crc32(u8) { if (!XLSX._crc) { XLSX._crc = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; XLSX._crc[n] = c >>> 0; } }

      const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, time, true); h.setUint16(12, date, true);

  x: s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ''),
  serial: d => { d = new Date(d); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()) - Date.UTC(1899, 11, 30)) / 864e5; },
  // style ids: 0 normal, 1 bold, 2 #,##0, 3 bold #,##0, 4 date+time, 5 0.0%, 6 title, 7 date
  cell(v, ref) {
    const o = v !== null && typeof v === 'object' && !(v instanceof Date) ? v : { v }; let val = o.v; let st = o.s ?? 0;

  sheet(rows, widths = []) {

      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="dd/mm/yyyy hh:mm"/><numFmt numFmtId="165" formatCode="0.0%"/><numFmt numFmtId="166" formatCode="dd/mm/yyyy"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: XLSX.sheet(s.rows, s.widths) }))];

// Minimal PDF writer (A4, Helvetica, WinAnsi) — produces a real downloadable .pdf without libraries.
const PDF = {
  HW: [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
  WIN: { 0x2013: 0x96, 0x2014: 0x97, 0x2018: 0x91, 0x2019: 0x92, 0x201c: 0x93, 0x201d: 0x94, 0x2022: 0x95, 0x2026: 0x85, 0x20ac: 0x80, 0x2212: 0x2d },
  codes(str) { const out = []; for (const ch of String(str ?? '')) { const c = ch.codePointAt(0); if (c >= 32 && c < 127) out.push(c); else if (c >= 160 && c < 256) out.push(c); else if (PDF.WIN[c]) out.push(PDF.WIN[c]); else if (c === 9 || c === 10 || c === 13) out.push(32); else out.push(63); } return out; },
  cw(c, bold) { const w = c >= 32 && c < 127 ? PDF.HW[c - 32] : c === 0x97 ? 1000 : c === 0x95 ? 350 : 556; return bold && !(c >= 48 && c <= 57) ? w * 1.06 : w; },
  width(str, size, bold) { return PDF.codes(str).reduce((a, c) => a + PDF.cw(c, bold), 0) * size / 1000; },
  fit(str, size, max, bold) { str = String(str ?? ''); if (PDF.width(str, size, bold) <= max) return str; let s = str; while (s.length && PDF.width(s + '…', size, bold) > max) s = s.slice(0, -1); return s + '…'; },
  doc(o = {}) { // o.landscape = A4 mendatar
    const W = o.landscape ? 841.89 : 595.28, H = o.landscape ? 595.28 : 841.89; const pages = [], imgs = []; let cur = null;
    const col = c => c.map(v => (v / 255).toFixed(3)).join(' ');
    const d = {
      W, H, get page() { return pages.length; },
      add() { cur = []; pages.push(cur); return d; },
      text(x, y, str, size = 10, o = {}) { const cs = PDF.codes(str); const w = PDF.width(str, size, o.bold); if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;

      box(x, y, w, h, stroke, lw = 0.6) { cur.push(`${col(stroke)} RG ${lw} w ${x.toFixed(2)} ${(H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`); },

      image(x, y, w, h, img) { // img = { w, h, jpg: binary string } — JPEG (DCTDecode)

      eachPage(fn) { const keep = cur; pages.forEach((p, i) => { cur = p; fn(i + 1, pages.length); }); cur = keep; },

        const xo = imgs.map((m, i) => `/Im${i + 1} ${add(`<< /Type /XObject /Subtype /Image /Width ${m.w} /Height ${m.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${m.jpg.length} >>\nstream\n${m.jpg}\nendstream`)} 0 R`).join(' ');

// ---------- server ----------
async function rpc(fn, args, opt = {}) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', keepalive: !!opt.keepalive, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
      if (!r.ok) { const e = new Error('server ' + r.status); e.server = true; throw e; }
      const t = await r.text(); return t ? JSON.parse(t) : null;
    } catch (e) { if (i >= (opt.tries ?? 4) || e.server) throw navigator.onLine ? e : new Error('offline'); await new Promise(r => setTimeout(r, 400 * (i + 1))); }
  }
}
const cacheKey = () => 'cmp.c.' + (C.me?.name || '');
function saveCache() { try { localStorage.setItem('ahg.' + cacheKey(), JSON.stringify({ seq: C.seq, rows: live() })); } catch {} }
function loadCache() { const c = jget(cacheKey(), null); if (!c) return; for (const r of c.rows || []) C.rows.set(r.id, r); C.seq = Number(c.seq || 0); }
function takeRow(x) {
  const r = { ...x, id: Number(x.id), seq: Number(x.seq), kubik: Number(x.kubik), kat: katOf(x.kat), t: x.at ? Date.parse(x.at) : 0 };
  if (r.deleted) C.rows.delete(r.id); else C.rows.set(r.id, r);
  C.seq = Math.max(C.seq, r.seq);
}
async function syncNow() {
  if (!C.token || C.sync.busy) return;
  C.sync.busy = true; let changed = false;
  try {
    for (let guard = 0; guard < 30; guard++) {
      const r = await rpc('cmp_sync', { p_token: C.token, p_after: C.seq }, { tries: 2 });
      if (!r?.ok) { if (r?.err === 'auth') return authLost(); throw new Error('server menolak'); }
      C.me = r.me; C.skew = Date.now() - Date.parse(r.now); C.katOk = !!r.kat;
      for (const x of r.rows || []) { takeRow(x); changed = true; }
      if (!r.more) break;
    }
    C.sync.err = ''; C.sync.at = Date.now();
    if (changed || !C.loaded) { C.loaded = true; saveCache(); render(); } else showSync();
  } catch (e) { C.sync.err = e?.message === 'offline' ? 'offline' : (e?.message || String(e)); showSync(); }
  finally { C.sync.busy = false; }
}
function authLost() {

// ---------- options (drop down list) ----------
// nilai yang pernah diinput, terbaru dulu; lambung (CMP) & spesifikasi: daftar baku kategori dulu (urut), lalu tambahan.
// spesifikasi & volume hanya dari kategori yang sedang dipilih
const katFor = inp => inp?.closest?.('#e-form') ? katOf($('#e-kat')?.value) : katOf(C.draft.kat);
function options(k, kat = C.draft.kat) {
  const seen = new Map(), own = k === 'mutu' || k === 'kubik';
  for (const r of live().sort((a, b) => b.t - a.t)) { if (own && r.kat !== katOf(kat)) continue; const v = k === 'kubik' ? m3(r.kubik) : r[k]; if (v && !seen.has(norm(v))) seen.set(norm(v), v); }
  const base = baseList(k, kat), out = [...base], has = new Set(base.map(norm));
  for (const [n, v] of seen) if (!has.has(n)) out.push(v);
  return out;
}
function ranked(k, text, list) {
  const q = norm(text); if (!q) return list.slice(0, 80);
  const lq = clean(text).toLowerCase(), hit = [];
  list.forEach((v, i) => {
    const n = norm(v), l = v.toLowerCase(); let s = -1;
    if (n === q) s = 0; else if (n.startsWith(q)) s = 1; else if (l.split(/[\s\-/.,()]+/).some(w => norm(w).startsWith(q))) s = 2; else if (n.includes(q)) s = 3;
    if (s >= 0) hit.push([s, i, v]);
  });
  return hit.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, 80).map(h => h[2]);
}
const markHit = (v, text) => { const t = clean(text); if (!t) return esc(v); const i = v.toLowerCase().indexOf(t.toLowerCase()); return i < 0 ? esc(v) : esc(v.slice(0, i)) + '<mark>' + esc(v.slice(i, i + t.length)) + '</mark>' + esc(v.slice(i + t.length)); };

// ---------- combobox: ketik "ABC" → daftar menyorot "ABCDEFG", Enter = pakai pilihan itu ----------

}
function cbOpen(inp, all) {
  const box = inp.closest('.cb'), k = box.dataset.k, mode = box.dataset.mode, text = all ? '' : inp.value;
  let list = ranked(k, text, mode === 'filter' ? filterOptions(k) : options(k, katFor(inp)));

  let pop = $('#cb-pop'); if (!pop) { pop = document.createElement('div'); pop.id = 'cb-pop'; pop.className = 'cb-pop'; pop.setAttribute('role', 'listbox'); }
  const host = inp.closest('dialog') || document.body; if (pop.parentElement !== host) host.appendChild(pop); // modal dialog = top layer
  pop.innerHTML = items.length ? items.map((it, i) => `<div class="cb-o ${i === CB.hi ? 'hi' : ''} ${it.add ? 'add' : ''}" role="option" data-i="${i}">${it.label}</div>`).join('')
    : `<div class="cb-none">${mode === 'filter' ? 'Tidak ada data yang cocok' : 'Belum ada data — ketik untuk menambah'}</div>`;
  pop.hidden = false; inp.setAttribute('aria-expanded', 'true'); cbPlace();
}
function cbPlace() {
  const pop = $('#cb-pop'); if (!pop || pop.hidden || !CB.el) return;
  const r = CB.el.closest('.cb').getBoundingClientRect(), below = innerHeight - r.bottom, h = Math.min(300, Math.max(140, below - 16));
  pop.style.left = r.left + 'px'; pop.style.width = r.width + 'px';
  if (below < 180 && r.top > below) { pop.style.top = ''; pop.style.bottom = (innerHeight - r.top + 4) + 'px'; pop.style.maxHeight = Math.min(300, r.top - 16) + 'px'; }
  else { pop.style.bottom = ''; pop.style.top = (r.bottom + 4) + 'px'; pop.style.maxHeight = h + 'px'; }
}
function cbClose() { const pop = $('#cb-pop'); if (pop) pop.hidden = true; CB.el?.setAttribute('aria-expanded', 'false'); CB.el = null; CB.hi = -1; }
function cbHi(i) {
  const pop = $('#cb-pop'); if (!pop || !CB.list.length) return;
  CB.hi = (i + CB.list.length) % CB.list.length;
  $$('.cb-o', pop).forEach((o, j) => o.classList.toggle('hi', j === CB.hi));

function cbPick(i, next) {
  const inp = CB.el, it = CB.list[i]; if (!inp || !it) return;
  inp.value = it.v; const k = CB.k, mode = CB.mode; cbClose();

// isi otomatis yang masih kosong: lambung → nopol & sopir terakhir truk itu, proyek → customer terakhir proyek itu
function autoFill(k) {

  return live().filter(r => r.t >= a && r.t < b && (!h.kat || r.kat === h.kat)
    && fs.every(([k, v, exact]) => exact ? norm(fval(r, k)) === v : norm(fval(r, k)).includes(v))

}

// batas volume per ritase: CMP maks 6 m³ (server: cmp_max)
function volBad(text, kat) {

}

  const TP = { cols: [['No', 3, 'c'], ['Nama Proyek', 22, 'l'], ['Customer', 20, 'l'], ['Ritase', 6, 'r'], [vh, 8, 'r']],
    rows: [...proj.map((p, i) => ({ c: [i + 1, p.proyek, p.customer, p.n, v(p.v)] })), { c: ['Jumlah', rows.length, v(vtot)], k: 'tot', span: 3, al: 'r' }] };
  const TM = { cols: [['No', 3, 'c'], [specT, kat === 'CMP' ? 11 : 16, 'l'], ['Ritase', 6, 'r'], [vh, 8, 'r'], ['Porsi', 6, 'r']],
    rows: [...mutu.map((p, i) => ({ c: [i + 1, p.mutu, p.n, v(p.v), tot ? (p.v / tot * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '-'] })), { c: ['Jumlah', rows.length, v(vtot), '100%'], k: 'tot', span: 2, al: 'r' }] };
  const gap = 18, wl = (RP.CW - gap) * 0.6, wr = RP.CW - gap - wl, mp = rkMeasure(TP, wl), mm = rkMeasure(TM, wr), hPair = 14 + Math.max(mp.total, mm.total);
  rkHead(R, `A.  RINGKASAN PER PROYEK DAN ${specL.toUpperCase()}`, Math.min(hPair, 120));
  const t1 = tab(), t2 = tab();
  if (R.y + hPair <= RP.bot) {
    rkCap(R, RP.ML, R.y, `Tabel ${t1}. Rekapitulasi per proyek`); rkCap(R, RP.ML + wl + gap, R.y, `Tabel ${t2}. Rekapitulasi per ${specL}`);
    const y0 = R.y + 14, y1 = rkPaint(d, mp, RP.ML, y0, mp.head, TP.rows.map((r, i) => [r, mp.rows[i]])), y2 = rkPaint(d, mm, RP.ML + wl + gap, y0, mm.head, TM.rows.map((r, i) => [r, mm.rows[i]]));
    R.y = Math.max(y1, y2) + 16;
  } else {
    rkCap(R, RP.ML, R.y, `Tabel ${t1}. Rekapitulasi per proyek`); R.y += 14; rkFlow(R, TP);
    rkNeed(R, 60); rkCap(R, RP.ML, R.y, `Tabel ${t2}. Rekapitulasi per ${specL}`); R.y += 14; rkFlow(R, TM, rkMeasure(TM, wl + 60));
  }

  // B. per truck & sopir
  const TT = { cols: [['No', 3, 'c'], ['No. Lambung', 9, 'l'], ['No. Polisi', 10, 'l'], ['Sopir', 18, 'l'], ['Ritase', 6, 'r'], [vh, 8, 'r']],
    rows: [...truk.map((t, i) => ({ c: [i + 1, t.lambung, t.nopol, t.sopir, t.n, v(t.v)] })), { c: ['Jumlah', rows.length, v(vtot)], k: 'tot', span: 4, al: 'r' }] };
  rkHead(R, `B.  REKAPITULASI PER ${K.veh.toUpperCase()} DAN SOPIR`, 70);
  rkCap(R, RP.ML, R.y, `Tabel ${tab()}. Ritase dan volume per ${K.veh}`); R.y += 14; rkFlow(R, TT, rkMeasure(TT, wl));

  // C. rincian (urut waktu keberangkatan, subtotal per hari bila lebih dari satu hari)
  const wide = kat !== 'CMP';
  const TD = { cols: [['No', 3, 'c'], ['Tanggal', 7, 'c'], ['Jam', 4.4, 'c'], ['Nama Proyek', wide ? 14 : 17, 'l'], ['Customer', wide ? 13 : 16, 'l'], ['No. Lambung', 6.6, 'l'], ['No. Polisi', 7.6, 'l'], ['Sopir', wide ? 9 : 10, 'l'], [wide ? 'Spesifikasi' : 'Mutu', wide ? 12.8 : 5.8, wide ? 'l' : 'c'], [vh, 6.6, 'r']], rows: [] };
  const days = new Map(); for (const r of rows) { const k = ymd(new Date(r.t)); if (!days.has(k)) days.set(k, []); days.get(k).push(r); }
  let no = 0;
  for (const list of days.values()) {
    for (const r of list) TD.rows.push({ c: [++no, dSlash(r.t), hDot(r.t), r.proyek, r.customer, r.lambung, r.nopol, r.sopir, r.mutu, v(r.kubik)] });
    if (days.size > 1) TD.rows.push({ c: [`Jumlah ${DAYS[new Date(list[0].t).getDay()]}, ${dIndo(list[0].t)}  -  ${list.length} ritase`, v(list.reduce((a, r) => a + r.kubik, 0))], k: 'sub', span: 9, al: 'r' });
  }
  TD.rows.push({ c: [`TOTAL  -  ${rows.length} ritase`, v(vtot)], k: 'tot', span: 9, al: 'r' });
  rkHead(R, 'C.  RINCIAN PENGIRIMAN', 80);
  rkCap(R, RP.ML, R.y, `Tabel ${tab()}. Rincian keberangkatan ${K.veh} (urut waktu keberangkatan)`); R.y += 14; rkFlow(R, TD);
}
function rkBuild(rows, per, logo) {
  const now = srvNow(), printed = `Dicetak ${dIndo(now)} pukul ${hDot(now)} WIB`, fl = rkFilters();
  const R = { d: PDF.doc({ landscape: true }), y: RP.top }, d = R.d, starts = [];
  let tn = 0;
  katTotals(rows).forEach(([kat], gi) => {
    if (gi) rkPage(R);
    starts.push([d.page, kat]);
    rkSection(R, rows.filter(r => r.kat === kat), kat, per, fl, () => ++tn);
  });

  // penutup + tanda tangan
  rkNeed(R, 40 + 130);
  rkPara(R, 'Demikian rekapitulasi pengiriman ini disusun berdasarkan data yang tercatat pada sistem Pengiriman AHG, untuk dapat dipergunakan sebagaimana mestinya. Apabila terdapat perbedaan dengan dokumen surat jalan atau tiket pengiriman di lapangan, mohon segera dikonfirmasikan kepada admin untuk dilakukan pemeriksaan dan koreksi data.');
  rkNeed(R, 130);
  d.text(RP.ML + RP.CW, R.y + 8, `Dicetak pada tanggal ${dIndo(now)}`, 9, { align: 'right', color: RC.text });
  const cw = RP.CW / 3, me = C.me?.display || C.me?.name || '';
  [['Dibuat oleh,', me], ['Diperiksa oleh,', ''], ['Mengetahui,', '']].forEach(([h, n], j) => { const cx = RP.ML + cw * j + cw / 2, y = R.y;
    d.text(cx, y + 30, h, 9, { align: 'center', color: RC.text });
    if (n) { const w = PDF.width(n, 9, true); d.text(cx, y + 94, n, 9, { bold: true, align: 'center', color: RC.text }); d.line(cx - w / 2 - 6, y + 97, cx + w / 2 + 6, y + 97, RC.text, 0.6); }
    else d.line(cx - 66, y + 97, cx + 66, y + 97, RC.text, 0.6);
    d.text(cx, y + 109, 'Jabatan: ..............................', 8, { align: 'center', color: RC.gray }); });
  R.y += 124;

  const katAt = i => { let k = starts[0][1]; for (const [p, x] of starts) if (p <= i) k = x; return k; };
  d.eachPage((i, n) => rkKop(d, logo, i, n, per, printed, katAt(i)));
  return d;
}
async function rkLogo() {
  if (rkLogo.v) return rkLogo.v;
  const e = $('.ahg-logo'), uri = e ? getComputedStyle(e).backgroundImage.replace(/^url\(["']?|["']?\)$/g, '') : '';
  const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error('logo tidak terbaca')); img.src = uri; });
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0);
  return rkLogo.v = { w: c.width, h: c.height, jpg: atob(c.toDataURL('image/jpeg', 0.95).split(',')[1]) };
}
async function rekapPdf(btn) {
  const rows = filtered().sort((a, b) => a.t - b.t); if (!rows.length) { toast('Tidak ada kiriman pada periode / filter ini.', 'warn'); return; }
  const t0 = btn.textContent; btn.disabled = true; btn.textContent = '⏳ Menyusun…';
  try {
    const d = rkBuild(rows, rkPeriod(rows), await rkLogo()), a = ymd(new Date(rows[0].t)), b = ymd(new Date(rows[rows.length - 1].t));
    const url = URL.createObjectURL(new Blob([d.build()], { type: 'application/pdf' }));
    const kt = katTotals(rows).map(k => k[0]), nm = kt.length === 1 ? KATS[kt[0]].title.replace(/ /g, '-') + '-' + kt[0] : 'Produksi-' + kt.join('-');
    const el = document.createElement('a'); el.href = url; el.download = `Rekap-Pengiriman-${nm}-${a}${b !== a ? '_sd_' + b : ''}.pdf`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(`📕 Rekap PDF diunduh (${d.page} halaman, ${rows.length} rit).`, 'ok', null, 3500);
  } catch (e) { console.error(e); toast('Gagal menyusun PDF: ' + esc(e.message), 'warn'); }
  finally { btn.disabled = false; btn.textContent = t0; }
}
